services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    # Toda la configuración (incluidos APP_ENV y APP_KEY) sale de .env; no se
    # repite aquí para no tener dos fuentes de verdad ni interpolaciones frágiles.
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app
      # Logs visibles desde el host: en dev, el código de verificación de
      # clientes (MAIL_MAILER=log) se lee aquí en storage/logs/laravel.log.
      - ./storage/logs:/var/www/html/storage/logs
    networks:
      - mosso_net

  db:
    image: mariadb:10.4
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-system_mosso}
    volumes:
      - db_data:/var/lib/mysql
      # Import automático del esquema + datos en un volumen nuevo. MariaDB solo
      # ejecuta esto la PRIMERA vez (db_data vacío); para reimportar hay que
      # `docker compose down -v`.
      - ./mosso.sql:/docker-entrypoint-initdb.d/01-mosso.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - mosso_net

volumes:
  db_data:
  storage_data:

networks:
  mosso_net:
    driver: bridge
